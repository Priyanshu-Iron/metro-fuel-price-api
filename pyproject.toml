[project]
name = "metro-fuel-price-api"
version = "0.1.0"
description = "REST API for time-series analysis of petrol and diesel prices across Indian metro cities"
authors = [
    {name = "Priyanshu-Iron",email = "ps2894944@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "pypdf (>=5.0.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
